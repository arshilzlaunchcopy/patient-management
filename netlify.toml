[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # These are public by design (shipped to the browser); stop the secrets scanner flagging them.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY"

[[plugins]]
  package = "@netlify/plugin-nextjs"
